<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Feedback | Sector 3 Group</title>
<style>
:root{--navy:#0D1B4C;--blue:#3F4FE0;--bg:#F4F6FB;--card:#ffffff;--line:#E2E6F0;--good:#1E8E5A;--bad:#C74444;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
.logo{display:block;max-width:280px;width:70%;height:auto;margin:8px auto 18px;}
h1{font-size:1.3rem;text-align:center;margin:0 0 4px;}
.sub{text-align:center;color:#5A6484;font-size:0.9rem;margin:0 0 20px;}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:22px;font-size:0.92rem;line-height:1.6;}
.course-card b{color:var(--navy);}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.section h2{font-size:1rem;margin:0 0 14px;color:var(--navy);}
.q{margin-bottom:16px;}
.q label.qlabel{display:block;font-size:0.92rem;margin-bottom:8px;font-weight:600;}
.scale{display:flex;gap:6px;flex-wrap:wrap;}
.scale button{flex:1 1 auto;min-width:64px;padding:9px 6px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:0.78rem;cursor:pointer;}
.scale button.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
.num10{display:flex;gap:5px;flex-wrap:wrap;}
.num10 button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:0.85rem;cursor:pointer;}
.num10 button.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;}
.yn{display:flex;gap:8px;}
.yn button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;font-size:0.88rem;}
.yn button.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-size:0.92rem;font-family:inherit;background:#fff;color:var(--navy);}
textarea{min-height:90px;resize:vertical;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.85rem;margin-bottom:6px;color:#4B5476;}
.optional{color:#8A93B0;font-weight:400;}
.submit-btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;}
.submit-btn:disabled{opacity:0.6;}
.msg{text-align:center;padding:40px 16px;}
.msg.err{color:var(--bad);}
.msg.ok{color:var(--good);}
.msg h2{color:inherit;}
.footer{text-align:center;font-size:0.75rem;color:#9099B5;margin-top:24px;}
.req{color:var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" style="max-width:130px;width:35%;" alt="Sector 3 Group" src="/sector3-logo.png" onerror="this.outerHTML='<h2 style=&quot;text-align:center;margin:8px 0 18px;&quot;>Sector 3 Group</h2>'">
  <div id="app"><div class="msg"><h2>Loading…</h2></div></div>
  <div class="footer">Sector 3 Group &middot; Course feedback</div>
</div>

<script>
const CLOUD = {
  url: 'https://kkknlzaamuiyfgmbkvqm.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtra25semFhbXVpeWZnbWJrdnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjk5MjgsImV4cCI6MjEwNTg0NTkyOH0.r-GocK5mjvjGyxmRDrU2X5DviGXdHhKmM2DNZP87LFA'
};

const FB_SCALE = ['Excellent','Very Good','Good','Satisfactory','Poor'];
const FB_CONF  = ['Extremely','Very','Confident','Fairly','Not at all'];
const FB_VENUE = [['venue','Venue / facilities'],['classroom','Classroom set-up'],['handouts','Handouts / books etc'],['equipment','Equipment'],['content','Course contents']];
const FB_TRAINER = [['knowledge','Subject knowledge'],['interest','Ability to hold your interest'],['methods','Use of effective teaching methods'],['support','Support and guidance'],['appearance','Appearance, eg clean and tidy'],['confidence','Confidence']];

const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
const app = document.getElementById('app');
const answers = { ratings:{}, rateTrainer:'', rateCentre:'', leaflet:'', comments:'', name:'', email:'', phone:'', title:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function rpc(name, body){
  const res = await fetch(CLOUD.url + '/rest/v1/rpc/' + name, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const t = await res.text(); throw new Error(t || ('Server error ' + res.status)); }
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

function scaleRow(key, label, options){
  return `<div class="q"><label class="qlabel">${esc(label)}</label>
    <div class="scale" data-key="${key}">
      ${options.map(o => `<button type="button" onclick="pickScale('${key}','${esc(o)}')">${esc(o)}</button>`).join('')}
    </div></div>`;
}

function render(info){
  const expires = new Date(info.expires);
  document.querySelector('h1') || null;
  app.innerHTML = `
    <h1>Course Feedback</h1>
    <p class="sub">Your honest feedback helps us improve future courses.</p>
    <div class="course-card">
      <div><b>Course:</b> ${esc(info.course || '—')}</div>
      <div><b>Date:</b> ${esc(info.date || '—')}</div>
      <div><b>Venue:</b> ${esc(info.venue || '—')}</div>
      <div><b>Trainer:</b> ${esc(info.trainer || '—')}</div>
    </div>

    <div class="section">
      <h2>The venue and materials</h2>
      ${FB_VENUE.map(([k,l]) => scaleRow(k,l,FB_SCALE)).join('')}
    </div>

    <div class="section">
      <h2>Your trainer</h2>
      ${FB_TRAINER.map(([k,l]) => scaleRow(k,l,FB_SCALE)).join('')}
    </div>

    <div class="section">
      ${scaleRow('pace','How was the pace of the course?',FB_SCALE)}
      ${scaleRow('howconfident','How confident do you feel using your new knowledge/skills?',FB_CONF)}
    </div>

    <div class="section">
      <div class="q"><label class="qlabel">Rate the trainer out of 10</label>
        <div class="num10" data-key="rateTrainer">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button type="button" onclick="pickNum('rateTrainer',${n})">${n}</button>`).join('')}</div>
      </div>
      <div class="q"><label class="qlabel">Rate the training centre out of 10</label>
        <div class="num10" data-key="rateCentre">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button type="button" onclick="pickNum('rateCentre',${n})">${n}</button>`).join('')}</div>
      </div>
      <div class="q"><label class="qlabel">Would you like to receive the Training Commitment Leaflet?</label>
        <div class="yn" data-key="leaflet">
          <button type="button" onclick="pickYN('Yes')">Yes</button>
          <button type="button" onclick="pickYN('No')">No</button>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Comments</h2>
      <div class="field"><label>Anything else you'd like to tell us? <span class="optional">(optional)</span></label>
        <textarea oninput="answers.comments=this.value"></textarea>
      </div>
    </div>

    <div class="section">
      <h2>Your details <span class="optional">(optional)</span></h2>
      <div class="field"><label>Name</label><input type="text" oninput="answers.name=this.value"></div>
      <div class="field"><label>Email</label><input type="email" oninput="answers.email=this.value"></div>
      <div class="field"><label>Phone</label><input type="tel" oninput="answers.phone=this.value"></div>
      <div class="field"><label>Job title</label><input type="text" oninput="answers.title=this.value"></div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit feedback</button>
    <p id="formErr" style="color:#C74444;text-align:center;font-size:0.85rem;"></p>
  `;
}

window.pickScale = function(key, val){
  answers.ratings[key] = val;
  const row = document.querySelector(`.scale[data-key="${key}"]`);
  [...row.children].forEach(b => b.classList.toggle('sel', b.textContent === val));
};
window.pickNum = function(key, val){
  answers[key] = String(val);
  const row = document.querySelector(`.num10[data-key="${key}"]`);
  [...row.children].forEach(b => b.classList.toggle('sel', Number(b.textContent) === val));
};
window.pickYN = function(val){
  answers.leaflet = val;
  const row = document.querySelector('.yn[data-key="leaflet"]');
  [...row.children].forEach(b => b.classList.toggle('sel', b.textContent === val));
};

window.submitForm = async function(){
  const err = document.getElementById('formErr');
  err.textContent = '';
  const need = [...FB_VENUE, ...FB_TRAINER, ['pace'],['howconfident']];
  for (const [k] of need) { if (!answers.ratings[k]) { err.textContent = 'Please answer every rating question before submitting.'; window.scrollTo(0,0); return; } }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await rpc('submit_feedback', { p_token: token, p_data: answers });
    app.innerHTML = `<div class="msg ok"><h2>Thank you</h2><p>Your feedback has been submitted.</p></div>`;
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Submit feedback';
    err.textContent = 'Something went wrong sending your feedback. Please try again.';
  }
};

(async function init(){
  if (!token) { app.innerHTML = `<div class="msg err"><h2>Link not found</h2><p>This feedback link is missing its code.</p></div>`; return; }
  try {
    const info = await rpc('feedback_link_info', { p_token: token });
    if (!info || !info.course) { app.innerHTML = `<div class="msg err"><h2>Link expired</h2><p>This feedback link has expired or is no longer valid. Please ask your trainer for a new QR code.</p></div>`; return; }
    render(info);
  } catch (e) {
    app.innerHTML = `<div class="msg err"><h2>Something went wrong</h2><p>Could not load this feedback form. Please try again later.</p></div>`;
  }
})();
</script>
</body>
</html>
