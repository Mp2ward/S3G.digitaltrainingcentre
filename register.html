<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Register | Sector 3 Group</title>
<style>
:root{--navy:#0D1B4C;--blue:#3F4FE0;--bg:#F4F6FB;--card:#ffffff;--line:#E2E6F0;--good:#1E8E5A;--bad:#C74444;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
.logo{display:block;max-width:260px;width:65%;height:auto;margin:8px auto 18px;}
h1{font-size:1.3rem;text-align:center;margin:0 0 4px;}
.sub{text-align:center;color:#5A6484;font-size:0.9rem;margin:0 0 20px;}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:22px;font-size:0.92rem;line-height:1.6;}
.course-card b{color:var(--navy);}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.85rem;margin-bottom:6px;color:#4B5476;}
.field label .req{color:var(--bad);}
.optional{color:#8A93B0;font-weight:400;}
input[type=text],select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-size:0.95rem;font-family:inherit;background:#fff;color:var(--navy);}
.sig-wrap{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;touch-action:none;}
canvas{display:block;width:100%;height:160px;touch-action:none;}
.sig-actions{display:flex;justify-content:flex-end;margin-top:6px;}
.sig-clear{background:none;border:none;color:var(--blue);font-size:0.82rem;cursor:pointer;padding:4px;}
.submit-btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;}
.submit-btn:disabled{opacity:0.6;}
.msg{text-align:center;padding:40px 16px;}
.msg.err{color:var(--bad);}
.msg.ok{color:var(--good);}
.footer{text-align:center;font-size:0.75rem;color:#9099B5;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" alt="Sector 3 Group" src="/sector3-logo.png" onerror="this.outerHTML='<h2 style=&quot;text-align:center;margin:8px 0 18px;&quot;>Sector 3 Group</h2>'">
  <div id="app"><div class="msg"><h2>Loading…</h2></div></div>
  <div class="footer">Sector 3 Group &middot; Course register</div>
</div>

<script>
const CLOUD = {
  url: 'https://kkknlzaamuiyfgmbkvqm.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtra25semFhbXVpeWZnbWJrdnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjk5MjgsImV4cCI6MjEwNTg0NTkyOH0.r-GocK5mjvjGyxmRDrU2X5DviGXdHhKmM2DNZP87LFA'
};

const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
const app = document.getElementById('app');

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function rpc(name, body){
  const res = await fetch(CLOUD.url + '/rest/v1/rpc/' + name, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const t = await res.text(); throw new Error(t || ('Server error ' + res.status)); }
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}

let canvas, ctx, drawing = false, hasDrawn = false;
window.onPositionChange = function(v){
  const box = document.getElementById('regPosition');
  if (v === '__other__') { box.style.display = 'block'; box.value = ''; box.focus(); }
  else { box.style.display = 'none'; box.value = v; }
};
function sigPos(e, rect){
  const t = e.touches && e.touches[0];
  return { x: (t ? t.clientX : e.clientX) - rect.left, y: (t ? t.clientY : e.clientY) - rect.top };
}
function sigStart(e){ e.preventDefault(); drawing = true; const p = sigPos(e, canvas.getBoundingClientRect()); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
function sigMove(e){ if (!drawing) return; e.preventDefault(); const p = sigPos(e, canvas.getBoundingClientRect()); ctx.lineTo(p.x, p.y); ctx.stroke(); hasDrawn = true; }
function sigEnd(e){ drawing = false; }
window.sigClear = function(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasDrawn = false;
};
function setupSignaturePad(){
  canvas = document.getElementById('sigCanvas');
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0D1B4C'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  canvas.addEventListener('mousedown', sigStart);
  canvas.addEventListener('mousemove', sigMove);
  window.addEventListener('mouseup', sigEnd);
  canvas.addEventListener('touchstart', sigStart, { passive:false });
  canvas.addEventListener('touchmove', sigMove, { passive:false });
  canvas.addEventListener('touchend', sigEnd);
}

function render(info){
  app.innerHTML = `
    <h1>Course Register</h1>
    <p class="sub">Please sign in below.</p>
    <div class="course-card">
      <div><b>Course:</b> ${esc(info.course || '—')}</div>
      <div><b>Date:</b> ${esc(info.date || '—')}</div>
      <div><b>Venue:</b> ${esc(info.venue || '—')}</div>
      <div><b>Trainer:</b> ${esc(info.trainer || '—')}</div>
    </div>

    <div class="section">
      <div class="field"><label>Full name <span class="req">*</span></label><input type="text" id="regName"></div>
      <div class="field"><label>Position <span class="optional">(optional)</span></label>
        <select id="regPositionSelect" onchange="onPositionChange(this.value)">
          <option value="">Select…</option>
          <option value="Nurse">Nurse</option>
          <option value="Doctor">Doctor</option>
          <option value="Health Care Assistant">Health Care Assistant</option>
          <option value="__other__">Other (type your own)</option>
        </select>
        <input type="text" id="regPosition" placeholder="Type your position" style="display:none;margin-top:8px;">
      </div>
      <div class="field"><label>Organisation <span class="optional">(optional)</span></label><input type="text" id="regOrg" value=""></div>
      <div class="field">
        <label>Signature <span class="req">*</span></label>
        <div class="sig-wrap"><canvas id="sigCanvas"></canvas></div>
        <div class="sig-actions"><button type="button" class="sig-clear" onclick="sigClear()">Clear</button></div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">Sign register</button>
    <p id="formErr" style="color:#C74444;text-align:center;font-size:0.85rem;"></p>
  `;
  setupSignaturePad();
}

window.submitForm = async function(){
  const err = document.getElementById('formErr');
  err.textContent = '';
  const name = document.getElementById('regName').value.trim();
  if (!name) { err.textContent = 'Please enter your name.'; return; }
  if (!hasDrawn) { err.textContent = 'Please sign above before submitting.'; return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const signature = canvas.toDataURL('image/png');
    await rpc('submit_register', {
      p_token: token, p_name: name,
      p_position: document.getElementById('regPosition').value.trim(),
      p_organisation: document.getElementById('regOrg').value.trim(),
      p_signature: signature
    });
    app.innerHTML = `<div class="msg ok"><h2>Signed in</h2><p>Thanks, ${esc(name)} — you're on the register.</p></div>`;
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Sign register';
    err.textContent = 'Something went wrong signing in. Please try again.';
  }
};

(async function init(){
  if (!token) { app.innerHTML = `<div class="msg err"><h2>Link not found</h2><p>This register link is missing its code.</p></div>`; return; }
  try {
    const info = await rpc('register_link_info', { p_token: token });
    if (!info || !info.course) { app.innerHTML = `<div class="msg err"><h2>Link expired</h2><p>This register link has expired or is no longer valid. Please ask your trainer for a new QR code.</p></div>`; return; }
    render(info);
  } catch (e) {
    app.innerHTML = `<div class="msg err"><h2>Something went wrong</h2><p>Could not load this register form. Please try again later.</p></div>`;
  }
})();
</script>
</body>
</html>
